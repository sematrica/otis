name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  engine-linux:
    name: Engine (Linux, real Whisper Small)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Install speech synthesizer for test fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Sync engine environment
        run: uv sync --project engine --extra dev --python 3.12
      - name: Unit, media, storage and RPC tests
        run: uv run --project engine pytest engine/tests -m "not model" -q
      - name: Verify model catalog against HuggingFace
        run: uv run --project engine python scripts/verify_model_catalog.py
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vdata/models
          key: models-linux-${{ hashFiles('engine/src/verbatim_engine/models/catalog.py') }}
      - name: Download Whisper Small, speaker and alignment models through the engine's own download path
        run: |
          for model in faster-whisper/small diarization/pyannote-wespeaker alignment/en-conformer-small \
                       alignment/en-conformer-medium alignment/mms-300m; do
            test -f "$RUNNER_TEMP/vdata/models/$model/verbatim-model.json" \
              || uv run --project engine verbatim-engine download-model "$model" --data-dir "$RUNNER_TEMP/vdata" > /dev/null
          done
          du -sh "$RUNNER_TEMP"/vdata/models/*/*
      - name: Fetch the speaker corpus (pinned, checksummed)
        run: uv run --project engine python engine/scripts/fetch_speaker_corpus.py "$RUNNER_TEMP/speaker-corpus"
      - name: Install Ollama and a small open model (real AI-review tests; local only)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull qwen2.5:0.5b
      - name: Real-model end-to-end tests
        env:
          VERBATIM_TEST_MODEL_DIR: ${{ runner.temp }}/vdata/models/faster-whisper/small
          VERBATIM_TEST_DIARIZATION_DIR: ${{ runner.temp }}/vdata/models/diarization/pyannote-wespeaker
          VERBATIM_TEST_ALIGNMENT_DIR: ${{ runner.temp }}/vdata/models/alignment/en-conformer-small
          VERBATIM_TEST_MMS_DIR: ${{ runner.temp }}/vdata/models/alignment/mms-300m
          VERBATIM_TEST_SPEAKER_CORPUS: ${{ runner.temp }}/speaker-corpus
          VERBATIM_TEST_REPORT: ${{ runner.temp }}/accuracy-linux.json
          VERBATIM_TEST_OLLAMA_MODEL: qwen2.5:0.5b
        run: uv run --project engine pytest engine/tests -m model -q -s -rs
      - name: Capture protocol fixtures (real engine messages, including an AI review with the local model)
        run: >-
          uv run --project engine python engine/scripts/capture_protocol_fixtures.py
          --model-path "$RUNNER_TEMP/vdata/models/faster-whisper/small"
          --diarization-dir "$RUNNER_TEMP/vdata/models/diarization/pyannote-wespeaker"
          --alignment-dir "$RUNNER_TEMP/vdata/models/alignment/en-conformer-small"
          --conversation "$RUNNER_TEMP/speaker-corpus/sample.wav" --ollama-model qwen2.5:0.5b
          && git status --short shared/protocol-fixtures
          && echo "----BEGIN PROTOCOL FIXTURES (tar.gz, base64)----"
          && tar -czf - -C shared protocol-fixtures | base64
          && echo "----END PROTOCOL FIXTURES----"
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-fixtures
          path: shared/protocol-fixtures
      - name: Word-timestamp benchmark (synthetic speech with known word times)
        working-directory: engine
        run: >-
          uv run python scripts/benchmark_word_timing.py --whisper "$RUNNER_TEMP/vdata/models/faster-whisper/small"
          --aligner "nemo:$RUNNER_TEMP/vdata/models/alignment/en-conformer-small"
          --aligner "nemo:$RUNNER_TEMP/vdata/models/alignment/en-conformer-medium"
          --aligner "mms:$RUNNER_TEMP/vdata/models/alignment/mms-300m"
          --voice en-us --voice en-us+f3 --voice en-gb-scotland --json "$RUNNER_TEMP/word-timing-linux.json"
      - name: Accuracy benchmark (Stage 3 corpus; one pass vs re-checking; Whisper Small)
        run: >-
          uv run --project engine python engine/scripts/benchmark_accuracy.py
          --whisper "$RUNNER_TEMP/vdata/models/faster-whisper/small"
          --diarization "$RUNNER_TEMP/vdata/models/diarization/pyannote-wespeaker"
          --alignment "$RUNNER_TEMP/vdata/models/alignment/en-conformer-small"
          --speaker-corpus "$RUNNER_TEMP/speaker-corpus" --cache "$RUNNER_TEMP/benchmark" --interrupted
          --json "$RUNNER_TEMP/benchmark-linux.json" --markdown "$RUNNER_TEMP/benchmark-linux.md"
          && cat "$RUNNER_TEMP/benchmark-linux.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-linux
          path: |
            ${{ runner.temp }}/accuracy-linux.json
            ${{ runner.temp }}/word-timing-linux.json
            ${{ runner.temp }}/benchmark-linux.json
            ${{ runner.temp }}/benchmark-linux.md
          if-no-files-found: ignore

  macos:
    name: macOS (Apple Silicon) build, tests and app bundle
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl -n machdep.cpu.brand_string hw.memsize hw.perflevel0.physicalcpu || true
      - name: Sync engine environment
        run: uv sync --project engine --extra dev --python 3.12
      - name: Install espeak-ng (speech with known word timings for tests)
        run: brew install espeak-ng
      - name: Engine unit tests
        run: uv run --project engine pytest engine/tests -m "not model" -q
      - name: Build Swift package
        run: swift build --package-path app
      - name: Report Metal / MLX availability
        run: |
          uv run --project engine python -c "import mlx.core as mx; print('metal available:', mx.metal.is_available()); print('default device:', mx.default_device())" || true
          uv run --project engine verbatim-engine info | head -60
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vdata/models
          key: models-macos-${{ hashFiles('engine/src/verbatim_engine/models/catalog.py') }}
      - name: Download Whisper Small (faster-whisper and MLX), speaker and alignment models through the engine
        run: |
          for model in faster-whisper/small mlx/small diarization/pyannote-wespeaker alignment/en-conformer-small; do
            test -f "$RUNNER_TEMP/vdata/models/$model/verbatim-model.json" \
              || uv run --project engine verbatim-engine download-model "$model" --data-dir "$RUNNER_TEMP/vdata" > /dev/null
          done
      - name: Fetch the speaker corpus (pinned, checksummed)
        run: uv run --project engine python engine/scripts/fetch_speaker_corpus.py "$RUNNER_TEMP/speaker-corpus"
      - name: Engine real-model tests (faster-whisper, MLX, speakers, alignment)
        env:
          VERBATIM_TEST_MODEL_DIR: ${{ runner.temp }}/vdata/models/faster-whisper/small
          VERBATIM_TEST_MLX_MODEL_DIR: ${{ runner.temp }}/vdata/models/mlx/small
          VERBATIM_TEST_DIARIZATION_DIR: ${{ runner.temp }}/vdata/models/diarization/pyannote-wespeaker
          VERBATIM_TEST_ALIGNMENT_DIR: ${{ runner.temp }}/vdata/models/alignment/en-conformer-small
          VERBATIM_TEST_SPEAKER_CORPUS: ${{ runner.temp }}/speaker-corpus
          VERBATIM_TEST_REPORT: ${{ runner.temp }}/accuracy-macos.json
        run: uv run --project engine pytest engine/tests -m model -q -s -rs
      - name: Swift tests (fixtures + real engine + real transcription and corrections)
        env:
          VERBATIM_ENGINE_PYTHON: ${{ github.workspace }}/engine/.venv/bin/python
          VERBATIM_TEST_MODEL_DIR: ${{ runner.temp }}/vdata/models/faster-whisper/small
          VERBATIM_TEST_DIARIZATION_DIR: ${{ runner.temp }}/vdata/models/diarization/pyannote-wespeaker
          VERBATIM_TEST_ALIGNMENT_DIR: ${{ runner.temp }}/vdata/models/alignment/en-conformer-small
          VERBATIM_TEST_SPEAKER_CORPUS: ${{ runner.temp }}/speaker-corpus
        run: swift test --package-path app
      - name: Build Verbatim.app
        run: scripts/build_app.sh
      - name: Smoke-test the app bundle
        run: scripts/smoke_test_app.sh build/Verbatim.app
      - name: Create a test video
        working-directory: engine
        run: |
          uv run python -c "
          from pathlib import Path
          from tests.conftest import encode_media, read_wav
          encode_media(Path('$RUNNER_TEMP/jfk-video.mp4'), read_wav(Path('tests/corpus/jfk.wav')), video=True)"
      - name: App self-test, faster-whisper (import → transcribe → workspace → quit)
        run: >-
          scripts/app_self_test.sh build/Verbatim.app "$RUNNER_TEMP/jfk-video.mp4"
          "$RUNNER_TEMP/vdata/models/faster-whisper/small" faster-whisper "fellow Americans"
      - name: App self-test, MLX
        run: >-
          scripts/app_self_test.sh build/Verbatim.app "$RUNNER_TEMP/jfk-video.mp4"
          "$RUNNER_TEMP/vdata/models/mlx/small" mlx "fellow Americans"
      - name: App self-test, Maximum Accuracy with speakers and word alignment (two-person call, rename, undo, re-check)
        run: |
          models="$HOME/Library/Application Support/Verbatim/models"
          mkdir -p "$models/diarization" "$models/alignment"
          ln -sfn "$RUNNER_TEMP/vdata/models/diarization/pyannote-wespeaker" "$models/diarization/pyannote-wespeaker"
          ln -sfn "$RUNNER_TEMP/vdata/models/alignment/en-conformer-small" "$models/alignment/en-conformer-small"
          scripts/app_self_test.sh build/Verbatim.app "$RUNNER_TEMP/speaker-corpus/sample.wav" \
            "$RUNNER_TEMP/vdata/models/faster-whisper/small" faster-whisper "New Jersey" 2
      - name: Package artifact
        run: ditto -c -k --keepParent build/Verbatim.app build/Verbatim.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Verbatim-app-unsigned
          path: build/Verbatim.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-macos
          path: ${{ runner.temp }}/accuracy-macos.json
          if-no-files-found: ignore
